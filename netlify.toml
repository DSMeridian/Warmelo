[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # @netlify/blobs needs Node 22.12+
  NODE_VERSION = "22"

# The site is published from the repo root, so keep backend and tooling files
# from being served as static pages.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
